<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Мой органайзер</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2eee6" media="(prefers-color-scheme: light)" data-scheme="light">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)" data-scheme="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Органайзер">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
<script src="boot.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header>
  <div class="head-row">
    <h1 id="app-title"></h1>
    <button type="button" id="settings-btn" data-action="tab" data-tab="settings"></button>
  </div>
  <div id="status" class="muted small"></div>
</header>
<div id="banners" aria-live="polite"></div>
<nav id="nav"></nav>
<main id="main"></main>
<pre id="boot-error" class="banner error" hidden></pre>
<noscript><p class="banner error">Для работы органайзера нужен включённый JavaScript. / The organizer needs JavaScript to be turned on.</p></noscript>
</body>
</html>
